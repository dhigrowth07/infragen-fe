services:
  # ==========================================
  # InfraGen Frontend Web (Production Environment)
  # Next.js Application
  # ==========================================
  frontend:
    image: 375291783713.dkr.ecr.us-east-1.amazonaws.com/infragen-prod:latest
    container_name: infragen_prod
    restart: unless-stopped
    ports:
      - "5007:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - infragen_fe_network_prod

networks:
  infragen_fe_network_prod:
    driver: bridge

